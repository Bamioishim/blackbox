name: CI

on:
  push:
    branches:
      - main
      - blackbox-finalization
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify published referee hash
        run: npm run referee-hash

      - name: Run automated tests
        run: npm test

      # Existing project-wide ESLint debt predates this CI workflow.
      # Keep the report visible without blocking verified tests/builds.
      - name: Report existing lint debt (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
