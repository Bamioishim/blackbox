name: Temporary dependency remediation

on:
  push:
    branches:
      - security-hardening
    paths:
      - .github/workflows/temporary-audit-fix.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible security updates
        run: |
          npm ci
          npm audit fix
          npm audit --audit-level=moderate
      - name: Verify tests and production build with dynamic wallet portfolio route
        run: |
          npm test
          npm run build
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: patch vulnerable transitive dependencies"
          git fetch origin security-hardening
          git rebase origin/security-hardening
          git push origin HEAD:security-hardening
